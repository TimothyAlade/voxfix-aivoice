<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>VoxFix AI Authentication</title>

<link rel="stylesheet" href="./style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

<div class="auth-container">

<div class="auth-card">

<!-- BRAND -->
<div class="auth-logo">
<div class="auth-icon">V</div>
<h1>VoxFix AI</h1>
</div>

<!-- HEADLINE -->
<h2>Access Your AI Workspace</h2>

<p>
Sign in to unlock premium communication intelligence.
</p>

<!-- INPUTS -->
<input type="text" id="nameInput" placeholder="Full Name" />

<input type="email" id="emailInput" placeholder="Email Address" />

<input type="password" id="passwordInput" placeholder="Password" />

<!-- BUTTON -->
<button id="authBtn" class="auth-btn">
Continue
</button>

<!-- GOOGLE LOGIN -->
<button id="googleBtn" class="google-btn">
Continue with Google
</button>

<!-- FOOTER -->
<p style="margin-top:18px; font-size:12px; color:#94a3b8;">
By continuing, you agree to VoxFix AI Terms & Privacy Policy.
</p>

</div>

</div>

<script type="module" src="./auth.js"></script>

</body>
</html>

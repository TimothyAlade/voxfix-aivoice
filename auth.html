<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>
VoxFix Authentication
</title>

<link
rel="stylesheet"
href="style.css"
/>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet"
/>

</head>

<body>

<div class="auth-container">

  <div class="auth-glow glow-left"></div>
  <div class="auth-glow glow-right"></div>

  <div class="auth-card">

    <div class="auth-logo">

      <div class="logo-box">
        V
      </div>

      <h1>
        VoxFix AI
      </h1>

    </div>

    <div class="auth-header">

      <h2>
        Welcome Back
      </h2>

      <p>
        Login or create your premium AI account
      </p>

    </div>

    <!-- FORM -->

    <div class="auth-form">

      <input
        type="text"
        id="nameInput"
        placeholder="First Name"
      />

      <input
        type="email"
        id="emailInput"
        placeholder="Email Address"
      />

      <input
        type="password"
        id="passwordInput"
        placeholder="Password"
      />

      <button
        onclick="signup()"
        class="auth-btn primary-btn"
      >
        Create Account
      </button>

      <button
        onclick="login()"
        class="auth-btn secondary-btn"
      >
        Login
      </button>

      <button
        onclick="googleLogin()"
        class="google-btn"
      >
        Continue With Google
      </button>

      <button
        onclick="guestLogin()"
        class="guest-btn"
      >
        Continue As Guest
      </button>

    </div>

  </div>

</div>

<script
type="module"
src="auth.js"
></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login - VoxFix AI</title>

<link rel="stylesheet" href="/assets/style.css"/>

<style>

/* PAGE CENTER */
.auth-body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#0b1220;
}

/* CARD */
.auth-card{
    width:360px;
    background:#111827;
    border:1px solid #1f2937;
    border-radius:18px;
    padding:28px;
    box-shadow:0 20px 40px rgba(0,0,0,0.35);
}

/* TITLE */
.auth-card h2{
    margin-bottom:8px;
    font-size:28px;
}

.subtext{
    color:#94a3b8;
    font-size:14px;
    margin-bottom:20px;
}

/* INPUTS */
.auth-card input{
    width:100%;
    margin-bottom:14px;
    padding:14px;
    border-radius:12px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
    outline:none;
}

/* BUTTON */
.auth-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#3b82f6;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.25s ease;
    position:relative;
    overflow:hidden;
}

/* HOVER */
.auth-btn:hover{
    background:#2563eb;
}

/* LOADING */
.auth-btn.loading{
    pointer-events:none;
    opacity:0.9;
}

/* SPINNER */
.spinner{
    width:18px;
    height:18px;
    border:2px solid rgba(255,255,255,0.4);
    border-top:2px solid white;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    margin:auto;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* FOOTER */
.auth-footer{
    margin-top:18px;
    text-align:center;
    color:#94a3b8;
    font-size:14px;
}

.auth-footer a{
    color:#3b82f6;
    text-decoration:none;
}

.status{
    margin-top:14px;
    font-size:13px;
    color:#94a3b8;
    text-align:center;
}
.btn-secondary{
    color:white;
    text-decoration:none;
}

</style>

</head>

<body class="auth-body">

<div class="auth-card">
<header class="nav">
    <a href="/index.html" class="btn-secondary">back</a>
</header>
    <h2>Welcome back</h2>

    <p class="subtext">
        Continue improving your communication instantly.
    </p>

    <input
        id="email"
        type="email"
        placeholder="Enter your email"
    />

    <input
        id="password"
        type="password"
        placeholder="Enter your password"
    />

    <button id="loginBtn" class="auth-btn">
        Login
    </button>

    <div id="statusText" class="status"></div>

    <div class="auth-footer">
        Don’t have an account?
        <a href="/signup.html">Create account</a>
    </div>

</div>
<script type="module">

import {
    login,
    initAuthRedirects
} from "/js/auth.js";


initAuthRedirects();


const btn =
    document.getElementById("loginBtn");

const status =
    document.getElementById("statusText");


btn.onclick = async () => {

    try {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value.trim();

        if (!email || !password) {

            status.innerText =
                "Complete all fields";

            return;
        }

        btn.disabled = true;

        btn.innerHTML = `
            <div class="spinner"></div>
        `;

        status.innerText =
            "Signing you in...";


        await login(email, password);


        status.innerText =
            "Redirecting...";


        /* FORCE REDIRECT */
        window.location.replace("/dashboard.html");

    } catch (err) {

        console.error(err);

        btn.disabled = false;

        btn.innerHTML = `Login`;

        status.innerText =
            err.message;
    }
};

</script>

</body>
</html>
